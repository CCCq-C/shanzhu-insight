<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>内容档案 · 山竹洞察</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="山竹洞察首页">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>山竹洞察</span>
      <small>CREATOR INTELLIGENCE</small>
    </a>
    <nav class="main-nav" aria-label="主要导航">
      <a href="/">大屏</a>
      <a class="active" href="/content" aria-current="page">内容</a>
    </nav>
    <div class="topbar-actions">
      <div class="system-status" id="header-status" aria-label="平台状态"></div>
      <div class="updated-at"><span>档案状态</span><strong id="result-count">载入中</strong></div>
      <a class="primary-button button-link" href="/">返回大屏</a>
    </div>
  </header>

  <main id="main-content" class="content-shell">
    <section class="content-hero">
      <div><span class="eyebrow">CONTENT ARCHIVE</span><h1>内容档案</h1><p>每条内容的发布平台、封面和表现，集中在一个视图。</p></div>
      <form class="filter-bar" id="content-filters">
        <label>平台<select id="platform-filter" name="platform"><option value="">全部平台</option><option value="xiaohongshu">小红书</option><option value="douyin">抖音</option><option value="channels">视频号</option></select></label>
        <label>时间<select id="date-filter" name="date"><option value="">全部时间</option><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option></select></label>
      </form>
    </section>
    <section class="content-list" id="content-list" aria-live="polite">
      <div class="panel empty-block">正在载入内容档案…</div>
    </section>
  </main>

  <script type="module" src="/content.js"></script>
</body>
</html>
