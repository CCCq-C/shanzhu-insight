name: 功能建议
description: 提议一个明确、可验证的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流中的具体问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述完成后用户能做什么
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 建议范围
      description: 包含什么，不包含什么
