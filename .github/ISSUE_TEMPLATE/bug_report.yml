name: Bug 报告
description: 报告可复现的问题，不要上传账号隐私数据
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "提交前请删除 Cookie、账号 ID、真实接口响应和未脱敏截图。"
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 或提交哈希
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11、Node.js 22.x、Chrome 版本
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 相关平台
      options: [抖音, 小红书, 视频号, 看板或本地服务, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用最小步骤描述预期结果和实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除 Cookie、账号 ID、真实接口响应和个人信息
          required: true
